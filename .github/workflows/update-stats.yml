name: Update GitHub Stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=jaredfischbach&rank_icon=github&hide_title=true&show=reviews%2Cdiscussions_started%2Cdiscussions_answered%2Cprs_merged%2Cprs_merged_percentage%2Cprs_commented%2Cprs_reviewed%2Cissues_commented%2Ccontributions%2Call_time_contribs&show_icons=true&include_all_commits=true&theme=vision-friendly-dark
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=jaredfischbach&layout=compact&hide_title=true&langs_count=20&theme=vision-friendly-dark&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true

      - name: Build combined stats card
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          # Shared rendered height for both cards.
          TARGET_H = 350

          # Small space between cards.
          GAP = 6

          files = [
              Path("profile/stats.svg"),
              Path("profile/top-langs.svg"),
          ]

          cards = []

          for path in files:
              svg = path.read_text()

              # Find the root SVG element.
              root_match = re.search(r'<svg\b[^>]*>', svg)

              if not root_match:
                  raise RuntimeError(
                      f"Could not find root SVG in {path}"
                  )

              root = root_match.group(0)

              # Read the SVG's natural coordinate system.
              viewbox_match = re.search(
                  r'viewBox="([\d.]+)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)"',
                  root
              )

              if viewbox_match:
                  vb_x, vb_y, vb_w, vb_h = map(
                      float,
                      viewbox_match.groups()
                  )

              else:
                  # Fall back to width and height if no viewBox exists.
                  width_match = re.search(
                      r'width="([\d.]+)"',
                      root
                  )

                  height_match = re.search(
                      r'height="([\d.]+)"',
                      root
                  )

                  if not width_match or not height_match:
                      raise RuntimeError(
                          f"Could not determine dimensions of {path}"
                      )

                  vb_x = 0
                  vb_y = 0
                  vb_w = float(width_match.group(1))
                  vb_h = float(height_match.group(1))

              # Calculate width automatically from the fixed height
              # while preserving the card's natural aspect ratio.
              rendered_w = round(
                  vb_w * TARGET_H / vb_h
              )

              # Remove only the outer SVG opening tag.
              inner = svg[root_match.end():]

              # Remove only the matching outer closing SVG tag.
              closing_match = re.search(
                  r'</svg>\s*$',
                  inner
              )

              if not closing_match:
                  raise RuntimeError(
                      f"Could not find closing SVG tag in {path}"
                  )

              inner = inner[:closing_match.start()]

              cards.append({
                  "inner": inner,
                  "vb_x": vb_x,
                  "vb_y": vb_y,
                  "vb_w": vb_w,
                  "vb_h": vb_h,
                  "width": rendered_w,
              })

          # Total width =
          # card widths + one GAP between each card.
          total_w = (
              sum(card["width"] for card in cards)
              + GAP * (len(cards) - 1)
          )

          groups = []

          x = 0

          for card in cards:
              groups.append(
                  f'''
            <svg
              x="{x}"
              y="0"
              width="{card["width"]}"
              height="{TARGET_H}"
              viewBox="{card["vb_x"]:g} {card["vb_y"]:g} {card["vb_w"]:g} {card["vb_h"]:g}"
              preserveAspectRatio="xMidYMid meet"
            >
          {card["inner"]}
            </svg>'''
              )

              # Move to the end of this card,
              # then add the small gap.
              x += card["width"] + GAP

          # Build one single SVG containing both cards.
          combined = f'''<svg
            xmlns="http://www.w3.org/2000/svg"
            width="{total_w}"
            height="{TARGET_H}"
            viewBox="0 0 {total_w} {TARGET_H}"
            preserveAspectRatio="xMidYMid meet"
            role="img"
            aria-label="GitHub statistics and top languages"
          >
          {''.join(groups)}
          </svg>
          '''

          output = Path("profile/github-stats.svg")

          output.write_text(combined)

          print("Generated combined SVG:")
          print(f"  {output}")
          print(f"  Size: {total_w}x{TARGET_H}")
          print(f"  Gap: {GAP}px")

          for path, card in zip(files, cards):
              print(
                  f"  {path.name}: "
                  f"{card['width']}x{TARGET_H}"
              )
          PY

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No changes to cards."
            exit 0
          fi

          git commit -m "Update GitHub profile stats"
          git push
