name: Update GitHub Stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=jaredfischbach&rank_icon=github&hide_title=true&show=reviews%2Cdiscussions_started%2Cdiscussions_answered%2Cprs_merged%2Cprs_merged_percentage%2Cprs_commented%2Cprs_reviewed%2Cissues_commented%2Ccontributions%2Call_time_contribs&show_icons=true&include_all_commits=true&theme=vision-friendly-dark
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=jaredfischbach&layout=compact&hide_title=true&langs_count=20&theme=vision-friendly-dark&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}
          fail_on_error: true

      - name: Normalize SVG dimensions
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          TARGET_W = 400
          TARGET_H = 350

          for filename in ["profile/stats.svg", "profile/top-langs.svg"]:
              path = Path(filename)
              svg = path.read_text()

              # Extract original width and height.
              width_match = re.search(
                  r'<svg\b[^>]*\bwidth="([\d.]+)"', svg
              )
              height_match = re.search(
                  r'<svg\b[^>]*\bheight="([\d.]+)"', svg
              )

              if not width_match or not height_match:
                  raise RuntimeError(
                      f"Could not determine dimensions of {filename}"
                  )

              original_w = float(width_match.group(1))
              original_h = float(height_match.group(1))

              # Get only the root <svg> opening tag.
              root_match = re.search(r'<svg\b[^>]*>', svg)

              if not root_match:
                  raise RuntimeError(
                      f"Could not find root SVG in {filename}"
                  )

              root = root_match.group(0)

              # Replace intrinsic dimensions.
              root = re.sub(
                  r'\bwidth="[^"]*"',
                  f'width="{TARGET_W}"',
                  root,
                  count=1
              )

              root = re.sub(
                  r'\bheight="[^"]*"',
                  f'height="{TARGET_H}"',
                  root,
                  count=1
              )

              # Remove existing viewBox and preserveAspectRatio.
              root = re.sub(
                  r'\s+viewBox="[^"]*"',
                  '',
                  root
              )

              root = re.sub(
                  r'\s+preserveAspectRatio="[^"]*"',
                  '',
                  root
              )

              # Add exactly one viewBox and preserveAspectRatio.
              root = root[:-1] + (
                  f' viewBox="0 0 {original_w:g} {original_h:g}"'
                  f' preserveAspectRatio="xMidYMid meet">'
              )

              svg = (
                  svg[:root_match.start()]
                  + root
                  + svg[root_match.end():]
              )

              path.write_text(svg)

              print(
                  f"{filename}: "
                  f"{original_w:g}x{original_h:g} "
                  f"-> {TARGET_W}x{TARGET_H}"
              )
          PY

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No changes to cards."
            exit 0
          fi

          git commit -m "Update GitHub profile stats"
          git push
